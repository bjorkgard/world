<!doctype html>
<html lang="en">

<title>Railgrid | Metro control</title>
<meta name="theme-color" content="#e6ebee">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2300A86B%27/%3E%3Cpath d=%27M9 9h14v10H9zM9 15h14M12 25l2-6M20 25l-2-6%27 stroke=%27white%27 stroke-width=%272%27 fill=%27none%27/%3E%3C/svg%3E">

<style>
:root{--green:#00A86B;--green-d:#008a58;--ink:#1d252c;--ink2:#5a6670;--glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.78);--line:rgba(30,45,55,.12);--shadow:0 10px 30px rgba(24,38,50,.14);--soft:rgba(30,45,55,.06)}
body.night{--ink:#e9eff3;--ink2:#9fb0bb;--glass:rgba(20,28,36,.6);--glass-b:rgba(255,255,255,.13);--line:rgba(255,255,255,.12);--shadow:0 10px 30px rgba(0,0,0,.45);--soft:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#e6ebee;font:13px/1.35 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body.night{background:#0e141b}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#ui>*{pointer-events:auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--glass-b);border-radius:16px;box-shadow:var(--shadow)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

#top{position:absolute;left:12px;right:12px;top:12px;min-height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:30}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.logo{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(0,168,107,.4)}
.logo svg{width:20px;height:20px;stroke-width:2}
.brand b{font-size:16px;letter-spacing:.2px;display:block;line-height:1.1}
.brand em{font-style:normal;font-size:10.5px;color:var(--ink2);display:block}
.search{position:relative;flex:1 1 220px;min-width:90px;max-width:300px}
.search>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink2);width:16px;height:16px;pointer-events:none}
.search input{width:100%;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:0 10px 0 33px;font:inherit;outline:none}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,168,107,.18)}
.drop{position:absolute;top:calc(100% + 8px);left:0;min-width:240px;max-height:60vh;overflow:auto;padding:6px;display:none;z-index:40;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--glass-b);border-radius:14px;box-shadow:var(--shadow)}
.drop.open{display:block}
.drop.right{left:auto;right:0}
.drop .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:9px}
.drop .it:hover,.drop .it.on{background:rgba(0,168,107,.14)}
.drop .it small{display:block;color:var(--ink2);font-size:11px}
.drop .ty{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--green);width:46px;flex:none;font-weight:600}
.drop .none{padding:10px;color:var(--ink2)}
#areas{display:flex;gap:3px;padding:3px;background:var(--soft);border-radius:12px;flex:none}
#areas button{padding:6px 10px;border-radius:9px;font-weight:500;color:var(--ink2);white-space:nowrap}
#areas button:hover{color:var(--ink)}
#areas button.on{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(0,168,107,.35)}
#areaSel{display:none;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;padding:0 8px;max-width:130px}
#areaSel option{color:#1d252c}
.sp{flex:1}
.menuwrap{position:relative;flex:none}
.chip{display:flex;align-items:center;gap:7px;height:36px;padding:0 11px;border-radius:11px;background:var(--soft);font-weight:500}
.chip:hover,.icon:hover{background:rgba(0,168,107,.14)}
.icon{position:relative;width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center}
.icon b{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#e5484d;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.icon b:empty{display:none}
#clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;letter-spacing:.3px;flex:none;text-align:right;line-height:1.1}
#clock small{display:block;font-size:10px;color:var(--ink2);font-weight:500;letter-spacing:0}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#00A86B,#2fbf86);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.dnl{font-size:10px;position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);display:none}

#kpis{position:absolute;left:12px;top:82px;display:flex;gap:10px;z-index:20}
.kpi{width:178px;padding:11px 13px 10px;position:relative;overflow:hidden}
.kpi h4 .sm{display:none}
.kpi h4{font-size:11px;font-weight:500;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--ink2);font-weight:500}
.kpi .d{font-size:11px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d.up{color:var(--green)}.kpi .d.dn{color:#d9534f}
.kpi canvas{position:absolute;right:9px;top:30px;width:56px;height:22px}

#detail{position:absolute;right:12px;top:82px;width:330px;max-height:calc(100% - 94px);overflow:auto;padding:14px;z-index:20}
#detail .hd{display:flex;align-items:flex-start;gap:10px}
#detail .ico{width:38px;height:38px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
#detail h3{font-size:16px;line-height:1.2}
#detail .sub{color:var(--ink2);font-size:12px}
#detail .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
#detail .x:hover{background:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(0,168,107,.16);color:var(--green-d)}
body.night .pill{color:#5be0a8}
.pill.warn{background:rgba(240,160,30,.2);color:#b36a00}.pill.bad{background:rgba(229,72,77,.18);color:#c43338}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#9aa;flex:none}
.dot.G{background:#25c97a;box-shadow:0 0 8px #25c97a}.dot.Y{background:#ffb300;box-shadow:0 0 8px #ffb300}.dot.R{background:#ff453a;box-shadow:0 0 8px #ff453a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{padding:8px 10px;border-radius:11px;background:var(--soft)}
.stat label{display:block;font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.stat b{font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.stat.wide{grid-column:span 2}
.bar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.bar i.hot{background:#e5484d}.bar i.mid{background:#f0a01e}
#chart{width:100%;height:64px;margin-top:10px;display:block}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:34px;border-radius:10px;background:var(--soft);font-weight:600}
.btn:hover{background:rgba(0,168,107,.16)}.btn.on{background:var(--green);color:#fff}
.idle{padding:6px 2px;color:var(--ink2)}.idle b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

#tracker{position:absolute;left:12px;bottom:12px;width:470px;padding:12px 14px 12px;z-index:20}
#tracker .th{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#tracker .th b{font-size:13px}#tracker .th span{color:var(--ink2);font-size:12px}
.steps{display:flex;position:relative}
.step{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--ink2);font-weight:500}
.step:before{content:'';position:absolute;top:8px;left:-50%;width:100%;height:3px;background:var(--soft);z-index:0}
.step:first-child:before{display:none}
.step.done:before,.step.on:before{background:var(--green)}
.step i{display:block;width:19px;height:19px;border-radius:50%;margin:0 auto 5px;background:var(--glass-b);border:2px solid var(--line);position:relative;z-index:1}
.step.done i{background:var(--green);border-color:var(--green)}
.step.on i{background:#fff;border-color:var(--green);box-shadow:0 0 0 4px rgba(0,168,107,.25);animation:pulse 1.4s infinite}
.step.on{color:var(--ink);font-weight:600}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(0,168,107,.05)}}
#trkMsg{margin-top:10px;font-size:12px;color:var(--ink2)}#trkMsg b{color:var(--ink)}

#table{position:absolute;left:494px;right:354px;bottom:12px;height:232px;display:flex;flex-direction:column;z-index:20;overflow:hidden}
#table .tabs{display:flex;align-items:center;gap:4px;padding:8px 10px 6px;border-bottom:1px solid var(--line);flex:none}
#table .tabs button{padding:6px 12px;border-radius:9px;font-weight:600;color:var(--ink2)}
#table .tabs button.on{background:var(--green);color:#fff}
#table .tabs .cnt{margin-left:auto;color:var(--ink2);font-size:11px}
#tgl{display:none;width:30px;height:30px;border-radius:8px;place-items:center}
.twrap{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);padding:7px 9px;font-weight:600}
td{padding:6px 9px;font-size:12.5px;white-space:nowrap;border-top:1px solid var(--line)}
tbody tr{cursor:pointer}tbody tr:hover{background:rgba(0,168,107,.1)}tbody tr.sel{background:rgba(0,168,107,.2)}
td .dot{margin-right:6px}
.late{color:#d9534f;font-weight:600}.early{color:var(--green)}

#tag{position:absolute;left:0;top:0;pointer-events:none;z-index:15;transform:translate(-50%,-100%);padding:5px 10px;border-radius:10px;background:var(--green);color:#fff;font-weight:600;font-size:12px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,168,107,.4);display:none}
#tag:after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--green);transform:translateX(-50%) rotate(45deg)}
#toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-14px);padding:9px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:92vw;text-align:center;font-weight:500}
#toast.show{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#e6ebee;color:#1d252c;z-index:99;transition:opacity .6s;font-weight:600;letter-spacing:.3px;text-align:center;padding:20px}
#boot.done{opacity:0;pointer-events:none}
#boot i{display:block;width:44px;height:44px;border-radius:12px;background:var(--green);margin:0 auto 14px;animation:pulse 1.2s infinite}

@media (max-width:1240px){
  #areas{display:none}#areaSel{display:block}
  #tracker{width:420px}#table{left:444px}
}
@media (max-width:900px),(max-height:500px) and (orientation:landscape){
  #top{flex-wrap:wrap;gap:8px;left:8px;right:8px;top:8px;padding:8px 10px}
  .brand em{display:none}.brand b{font-size:15px}
  .search{order:2;flex:1 1 120px;max-width:none}
  .sp{display:none}
  #areaSel{order:3;flex:1 1 90px;max-width:none}
  .menuwrap,#clock{order:4}
  .menuwrap:last-child{order:2;margin-left:auto}
  #clock{font-size:13px}#clock small{display:none}
  .chip span{display:none}.chip{padding:0 9px}
  .drop{position:fixed;left:8px!important;right:8px!important;top:auto;min-width:0;max-height:55vh}
  #top .search .drop{position:absolute;left:0!important;right:0!important}
  #kpis{left:8px;right:8px;top:calc(var(--topH,110px) + 14px);gap:6px}
  .kpi{flex:1;width:auto;padding:8px 9px 7px;min-width:0}.kpi .v{font-size:19px}.kpi .d{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi canvas{display:none}.kpi h4 .lg{display:none}.kpi h4 .sm{display:inline}.kpi h4{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #detail{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:50vh;padding:12px}
  #tracker{position:static;width:auto;margin-top:12px;padding:10px 0 0;background:none;border:0;box-shadow:none;border-top:1px solid var(--line);border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none}
  .step{font-size:9px}
  #table{left:8px;right:8px;bottom:8px;height:40vh}
  #table.col{height:46px}
  #tgl{display:grid}
  body.has-sel #table{display:none}
}
@media (max-height:500px) and (orientation:landscape){
  #detail{left:auto;right:8px;top:calc(var(--topH,58px) + 14px);bottom:8px;width:min(380px,46vw);max-height:none}
  body.has-sel #kpis{display:none}
}
</style>

  <section id="kpis">

    <div class="kpi glass"><h4>Riders today</h4><div class="v" id="k3">-</div><div class="d" id="k3d">-</div><canvas id="s3" width="140" height="56"></canvas></div>
  </section>
  <aside id="detail" class="glass"></aside>
  <section id="tracker" class="glass">
    <div class="th"><b>Journey tracker</b><span id="trkWho">Select a train</span></div>
    <div class="steps" id="steps"></div>
    <div id="trkMsg">Click a train in the scene or the Trains table to follow its journey.</div>
  </section>
  <section id="table" class="glass">
    <div class="tabs"><button data-tab="trains" class="on">Trains</button><button data-tab="stations">Stations</button><button data-tab="signals">Signals</button><span class="cnt" id="tcnt"></span><button id="tgl" aria-label="Expand table"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button></div>
    <div class="twrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>
  <div id="tag"></div>
  <div id="toast" class="glass"></div>
</div>

// signed distance to a rounded rectangle outline (negative inside)
function sdRR(x, z, hx, hz, r) {

}
// clockwise rounded rectangle polyline starting at (0,-hz) heading +x
function rrPoints(hx, hz, r, step) {
  const pts = [], sx = hx - r, sz = hz - r;
  const line = (x0, z0, x1, z1) => { const n = Math.max(1, Math.round(Math.hypot(x1 - x0, z1 - z0) / step)); for (let i = 0; i < n; i++) { const t = i / n; pts.push([x0 + (x1 - x0) * t, z0 + (z1 - z0) * t]); } };

}
function bezier(p0, c1, c2, p1, n) {
