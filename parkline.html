<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Parkline | Theme park</title>
<meta name="theme-color" content="#FBF4E8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23F43F5E%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--accent:#F43F5E;--acct:#881337;--accf:#BE123C;--cream:#FBF4E8;--ink:#3b2f2a;--ink2:#54453c;--glass:rgba(255,251,244,.76);--glass-b:rgba(255,255,255,.8);--line:rgba(60,40,30,.12);--chip:rgba(60,40,30,.06);--chip2:rgba(60,40,30,.11);--pop:rgba(255,251,244,.96);--shadow:0 10px 30px rgba(90,60,40,.14);--gut:16px}
body.night{--acct:#FDA4AF;--ink:#f6ece0;--ink2:#f0e6da;--glass:rgba(36,33,50,.74);--glass-b:rgba(255,255,255,.15);--line:rgba(255,255,255,.14);--chip:rgba(255,255,255,.08);--chip2:rgba(255,255,255,.15);--pop:rgba(40,36,56,.96);--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:var(--cream);font:13px/1.35 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#ui>*{pointer-events:auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--glass-b);border-radius:16px;box-shadow:var(--shadow);transition:background .6s,border-color .6s}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
h2,h3,.logo{font-family:'Fredoka','Manrope',system-ui,sans-serif}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{display:inline-flex}
.grow{flex:1}
.hid{display:none!important}
/* top bar */
#top{position:absolute;left:var(--gut);right:var(--gut);top:12px;height:56px;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:30}
#sec{display:contents}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:21px;letter-spacing:.2px;order:0;padding-right:6px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 10px rgba(244,63,94,.4)}
.logo i svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#search{position:relative;order:1;flex:0 1 270px;min-width:120px}
#search .ico{position:absolute;left:11px;top:9px;color:var(--ink2);pointer-events:none}
#q{width:100%;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--chip);padding:0 12px 0 34px;outline:none;transition:border-color .2s,box-shadow .2s}
#q::placeholder{color:var(--ink2)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(244,63,94,.18)}
.btn{height:36px;padding:0 11px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;font-weight:700;background:var(--chip);white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--chip2)}
.btn.icon{width:36px;padding:0;justify-content:center}
.dd{position:relative}
.dd.open>.btn{background:var(--chip2)}
.dd>.btn .chev{width:14px;height:14px;opacity:.6;transition:transform .2s}
.dd.open>.btn .chev{transform:rotate(180deg)}
#dArea{order:2}#dWx{order:3}.fill{order:4;flex:1}#clockbox{order:5}#dAl{order:6}#bTod{order:7}#dUser{order:8}#bBurger{order:9;display:none}
.pop{position:absolute;top:calc(100% + 8px);left:0;min-width:210px;padding:6px;border-radius:14px;background:var(--pop);border:1px solid var(--glass-b);box-shadow:var(--shadow);display:none;z-index:40}
.pop.right{left:auto;right:0}
.dd.open>.pop,#sres.on{display:block}
.pop button,.pop .row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;font-weight:600}
.pop button:hover,.pop .row.hl{background:var(--chip2)}
.pop .cur{color:var(--acct)}
.pop .tick{margin-left:auto;color:var(--acct);opacity:0}
.pop .cur .tick{opacity:1}
.pop .sub{font-weight:500;color:var(--ink2);font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#sres{top:calc(100% + 6px);left:0;right:0;min-width:240px}
#sres .row small{margin-left:auto;color:var(--ink2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
#sres mark{background:none;color:var(--acct)}
#sres .none{padding:10px;color:var(--ink2)}
#clockbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;padding:0 6px}
#clock{font:600 20px 'Fredoka',sans-serif}
#open{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--ink2)}
#open.on{color:var(--acct)}
#bAl{position:relative}
#badge{position:absolute;right:-3px;top:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accf);color:#fff;font:800 10.5px/17px 'Manrope';font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--cream)}
body.night #badge{box-shadow:0 0 0 2px #2a2738}
#mAl{width:350px;padding:0}
#mAl .h{display:flex;align-items:center;padding:12px 14px 8px;font:600 15px 'Fredoka'}
#mAl .h small{margin-left:auto;font:600 11px 'Manrope';color:var(--ink2)}
#alist{max-height:340px;overflow:auto;padding:0 6px 6px}
#alist .al{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:10px;width:100%;text-align:left;font-weight:600}
#alist .al:hover{background:var(--chip2)}
#alist .al .ai{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--chip2);flex:none}
#alist .al.live .ai{background:var(--accent);color:#fff}
#alist .al span{display:block;font-weight:500;color:var(--ink2);font-size:11.5px}
#alist .empty{padding:18px;text-align:center;color:var(--ink2)}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accf),#C23152);color:#fff;font:800 11px/26px 'Manrope';text-align:center;flex:none}
.btn.user{padding-left:5px}
/* KPI cards */
#kpis{position:absolute;left:var(--gut);top:80px;display:flex;gap:10px;z-index:10}
.kpi{width:208px;padding:11px 13px 8px;position:relative;overflow:hidden}
.kpi .l{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2)}
.kpi .v{font:600 26px/1.15 'Fredoka',sans-serif;margin-top:2px}
.kpi .v small{font:700 13px 'Manrope';color:var(--ink2);margin-left:3px}
.kpi .d{font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:4px}
.kpi .d b{color:var(--acct)}
.kpi .sub{font-size:10.5px;font-weight:600;color:var(--ink2);margin-top:1px;white-space:nowrap}
.kpi .sp{height:30px;margin:4px -4px 0}
.sp svg,.chart svg{display:block;width:100%;height:100%;overflow:visible}
.sp .ln,.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.sp .ar,.chart .ar{fill:rgba(244,63,94,.13);stroke:none}
/* panels */
.panel{position:absolute}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:800;letter-spacing:.3px;background:var(--chip2);color:var(--ink)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pill.closed{background:var(--ink);color:var(--cream)}
body.night .pill.closed{background:#f6ece0;color:#2a2738}
.pill.hold{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--acct)}
.pill.hot{background:var(--accf);color:#fff}
.pill.hot i{background:#fff}
.pill .ic{width:12px;height:12px;stroke-width:2.4}
#detail{right:var(--gut);top:80px;width:320px;max-height:calc(100% - 96px);overflow:auto;padding:16px;z-index:10}
#detail .x{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
#detail .x:hover{background:var(--chip2)}
.kind{color:var(--acct);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
#detail h2{font-size:21px;font-weight:600;line-height:1.15;margin:2px 28px 8px 0}
#dEmpty{text-align:center;padding:14px 8px 8px;color:var(--ink2)}
#dEmpty svg{width:64px;height:64px;margin-bottom:6px}
#dEmpty b{display:block;font:600 16px 'Fredoka';color:var(--ink);margin-bottom:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stats div{background:var(--chip);border-radius:12px;padding:8px 10px}
.stats dt{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2)}
.stats dd{font:600 18px/1.2 'Fredoka'}
.stats dd small{font:600 11px 'Manrope';color:var(--ink2);margin-left:2px}
.chart{margin-top:12px;background:var(--chip);border-radius:12px;padding:9px 10px 6px}
.chart .h{display:flex;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2)}
.chart .h b{margin-left:auto;color:var(--ink);font-size:12px}
.chart .cv{height:78px;margin-top:4px}
.chart .ax{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);margin-top:2px}
.chart .gl{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart .mk{fill:var(--accent);stroke:none}
/* ride cycle tracker */
#tracker{left:var(--gut);bottom:var(--gut);width:392px;padding:12px 14px 12px;z-index:10}
.ph{display:flex;align-items:center;gap:8px}
.ph h3{font-size:16px;font-weight:600}
#trSel{height:28px;border-radius:9px;border:1px solid var(--line);background:var(--chip);padding:0 6px;font-weight:700;max-width:160px;outline:none;cursor:pointer}
#trSel option{color:#3b2f2a}
#trSteps{list-style:none;display:flex;margin-top:12px}
#trSteps li{flex:1;text-align:center;position:relative;color:var(--ink2);transition:color .2s,opacity .3s}
#trSteps li::before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
#trSteps li:first-child::before{display:none}
#trSteps li.done::before,#trSteps li.cur::before{background:var(--accent)}
#trSteps b{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:11px;background:var(--pop);box-shadow:inset 0 0 0 2px var(--line)}
#trSteps li.done b{box-shadow:inset 0 0 0 2px var(--accent);color:var(--acct)}
#trSteps li.cur b{background:var(--accf);color:#fff;box-shadow:0 0 0 4px rgba(244,63,94,.22)}
#trSteps span{display:block;margin-top:5px;font-size:11px;font-weight:700}
#trSteps li.cur span{color:var(--ink);font-weight:800}
#trSteps .bar{display:block;height:4px;border-radius:2px;background:var(--chip2);margin:5px 5px 0;overflow:hidden}
#trSteps .bar u{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;text-decoration:none}
#trSteps.dim li:not(.cur){font-style:italic}
#trInfo{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--ink2);font-weight:600;align-items:center}
#trInfo b{color:var(--ink);font-weight:800}
#trNote{margin-top:8px;font-size:12px;font-weight:700;color:var(--acct);display:none;align-items:center;gap:6px}
#trNote.on{display:flex}
/* table */
#table{left:calc(var(--gut) + 404px);right:calc(var(--gut) + 332px);bottom:var(--gut);padding:10px 12px 8px;z-index:10;min-width:300px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:11px}
.tabs button{padding:5px 12px;border-radius:9px;font-weight:800;color:var(--ink2)}
.tabs button.on{background:var(--pop);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
#tbCol{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
#tbCol:hover{background:var(--chip2)}
#tbCol .ic{transition:transform .2s}
#table.col #tbCol .ic{transform:rotate(180deg)}
.tbody{margin-top:8px;max-height:196px;overflow:auto}
#table.col .tbody{display:none}
table{width:100%;border-collapse:collapse;font-weight:600}
th{position:sticky;top:0;background:var(--pop);text-align:right;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);padding:6px 8px;cursor:pointer;white-space:nowrap;user-select:none}
th:first-child,td:first-child{text-align:left}
th.s{color:var(--acct)}
th .ar{display:inline-block;width:8px;font-size:9px}
td{padding:6px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--chip)}
tbody tr.sel{background:rgba(244,63,94,.12)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td .st{display:inline-block;padding:1px 8px;border-radius:9px;font-size:10.5px;font-weight:800;background:var(--chip2)}
td .st.Closed{background:var(--ink);color:var(--cream)}
body.night td .st.Closed{background:#f6ece0;color:#2a2738}
td .st.Hold{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--acct);background:none;padding:2px 8px}
td.hi{color:var(--acct);font-weight:800}
#label{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:4px 10px;border-radius:999px;background:var(--accf);color:#fff;font-weight:700;font-size:12px;white-space:nowrap;pointer-events:none;display:none;box-shadow:0 4px 12px rgba(244,63,94,.4)}
#dock{display:none}
#toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-8px);padding:8px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1180px){#table{right:calc(var(--gut) + 292px)}#detail{width:280px}.kpi{width:180px}}
@media (max-width:1000px) and (min-width:769px){#table{left:var(--gut);bottom:172px}.tbody{max-height:150px}}
/* mobile (<= 768 px wide or a short landscape phone) */
.m #top{top:8px;height:48px;gap:6px;padding:0 6px}
.m .logo span{display:none}.m .logo{padding:0}
.m #search{flex:1 1 auto;order:1;min-width:0}
.m #clockbox{order:3;padding:0 2px}.m #clock{font-size:17px}
.m #dAl{order:4}.m #bBurger{display:inline-flex;order:5}.m #open{font-size:9px}
.m .fill{display:none}
.m #sec{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);flex-direction:column;align-items:stretch;gap:8px;padding:10px;border-radius:16px;background:var(--pop);border:1px solid var(--glass-b);box-shadow:var(--shadow);max-height:70vh;overflow:auto;z-index:45}
.m #top.menu #sec{display:flex}
.m #sec .dd,.m #sec>.btn{order:0;width:100%}
.m #sec .btn{width:100%;justify-content:flex-start;height:42px}
.m #sec .dd>.btn .chev{margin-left:auto}
.m #sec .pop{position:static;box-shadow:none;border:0;background:var(--chip);margin-top:6px;min-width:0}
.m #q{height:38px}.m #search .ico{top:10px}
.m .btn.icon{width:38px;height:38px}
.m #kpis{left:0;right:0;top:64px;padding:0 var(--gut) 4px;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scroll-padding:0 var(--gut);scrollbar-width:none}
.m #kpis::-webkit-scrollbar{display:none}
.m .kpi{flex:0 0 150px;width:150px;padding:8px 10px 6px;scroll-snap-align:start}
.m .kpi .sub{display:none}
.m .kpi .v{font-size:21px}.m .kpi .sp{height:22px}.m .kpi .l{font-size:10px}.m .kpi .d{font-size:10.5px}
.m #detail,.m #tracker,.m #table{position:fixed;left:var(--gut);right:var(--gut);bottom:calc(60px + env(safe-area-inset-bottom));top:auto;width:auto;min-width:0;max-height:42vh;overflow:auto;display:none;z-index:20}
.m #table{padding:10px 10px 6px}
.m .tbody{max-height:calc(42vh - 70px)}
.m .lo{display:none}
.m[data-sheet=detail] #detail,.m[data-sheet=cycle] #tracker,.m[data-sheet=table] #table{display:block}
.m #tracker,.m #table{overflow:hidden}
.m #trSteps span{font-size:10px}
.m #dock{position:fixed;left:var(--gut);right:var(--gut);bottom:calc(8px + env(safe-area-inset-bottom));height:46px;display:flex;gap:6px;padding:5px;z-index:25}
.m #dock button{flex:1;border-radius:11px;font-weight:800;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.m #dock button.on{background:var(--accf);color:#fff}
.m #toast{top:116px}
.m.ml #top{top:6px;height:44px}
.m.ml #kpis{top:56px}.m.ml .kpi{flex:0 0 132px;width:132px;padding:5px 9px 4px}.m.ml .kpi .sp,.m.ml .kpi .d span{display:none}.m.ml .kpi .v{font-size:18px}
.m.ml #detail,.m.ml #tracker,.m.ml #table{left:auto;right:var(--gut);width:min(360px,46vw);top:104px;bottom:60px;max-height:none}
.m.ml .tbody{max-height:calc(100% - 52px)}
.m.ml #dock{left:var(--gut);right:auto;width:min(360px,46vw);bottom:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <header id="top" class="glass">
    <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M3 17c3-9 6-9 9 0s6 9 9 0"/><circle cx="12" cy="6.5" r="1.4" fill="#fff" stroke="none"/></svg></i><span>Parkline</span></div>
    <div id="search"><span class="ico" data-ic="search"></span><input id="q" type="text" placeholder="Search rides, stalls, queues" autocomplete="off" spellcheck="false" aria-label="Search park" enterkeyhint="go"><div id="sres" class="pop" role="listbox"></div></div>
    <div id="sec">
      <div class="dd" id="dArea"><button class="btn" id="bArea" aria-haspopup="true"><span class="ico" data-ic="pin"></span><span id="areaName">Areas</span><span class="ico chev" data-ic="chev"></span></button><div class="pop" id="mArea"></div></div>
      <div class="dd" id="dWx"><button class="btn" id="bWx" aria-haspopup="true"><span class="ico" id="wxIc"></span><span id="wxName">Sunny</span><span class="ico chev" data-ic="chev"></span></button><div class="pop" id="mWx"></div></div>
      <button class="btn" id="bTod" title="Day / night: Auto, Day, Night"><span class="ico" id="todIc"></span><span id="todName">Auto</span></button>
      <div class="dd" id="dUser"><button class="btn user" id="bUser" aria-haspopup="true"><b class="av">ML</b><span>Mia Larsen</span><span class="ico chev" data-ic="chev"></span></button>
        <div class="pop right" id="mUser"><div class="row"><b class="av">ML</b><div>Mia Larsen<div class="sub">Park operations manager</div></div></div><hr><button data-u="profile">View profile</button><button data-u="shift">Shift notes</button><button data-u="settings">Settings</button><hr><button data-u="out">Sign out</button></div></div>
    </div>
    <div class="fill"></div>
    <div id="clockbox"><b id="clock">11:00</b><small id="open">Open</small></div>
    <div class="dd" id="dAl"><button class="btn icon" id="bAl" aria-haspopup="true" aria-label="Alerts"><span class="ico" data-ic="bell"></span><em id="badge">0</em></button>
      <div class="pop right" id="mAl"><div class="h">Alerts<small id="alSub"></small></div><div id="alist"></div></div></div>
    <button class="btn icon" id="bBurger" aria-label="Menu"><span class="ico" data-ic="menu"></span></button>
  </header>
  <section id="kpis"></section>

  else if (r.id === 'monorail') { const { st, L } = monorail; u = ph === 'Loading' ? st.t / 9 : ph === 'Dispatch' ? st.p / 24 : ph === 'Ride' ? (st.p - 24) / (L - 70) : ph === 'Brake' ? (st.p - (L - 46)) / 46 : st.t / 6; }
  else u = r.phaseT / r.cycle[r.cycIdx][1];
  u = clamp(u, 0, 1);
  if (r.id !== 'coaster' && r.id !== 'flume' && ph === 'Ride') { if (u < 0.18) { ph = 'Lift'; u /= 0.18; } else u = (u - 0.18) / 0.82; }       // rides without a lift hill: the first part of the ride is the spin-up
  return { idx: Math.max(0, PH6.indexOf(ph)), u, phase: ph };
}
function paintTracker() {
  const r = ents[trId], c = cycleState(r), items = $('trSteps').children;
  for (let i = 0; i < 6; i++) { const li = items[i]; li.className = i < c.idx ? 'done' : i === c.idx ? 'cur' : ''; li.querySelector('u').style.width = (i < c.idx ? 100 : i === c.idx ? Math.round(c.u * 100) : 0) + '%'; }
  const bad = r.status === 'Hold' || r.status === 'Closed';
  $('trSteps').classList.toggle('dim', bad); const tp = $('trPill'); tp.className = 'pill ' + (r.status === 'Closed' ? 'closed' : r.status === 'Hold' ? 'hold' : ''); tp.innerHTML = r.status === 'Open' ? `<i></i>${c.phase}` : `${svgI(r.status === 'Hold' ? 'pause' : 'ban')}${r.status}`;
  const nt = $('trNote'); nt.classList.toggle('on', bad);
  if (bad) nt.innerHTML = svgI(r.status === 'Hold' ? 'pause' : 'ban') + (r.status === 'Hold' ? (r.phase === 'Loading' ? 'Wind hold: the train waits in the station and the queue is held' : 'Wind hold: the train finishes this lap, then waits in the station; the queue is held') : r.wClosed ? 'Closed for rain: no new riders, the queue drains through the exits' : 'Park closed');
  const extra = r.id === 'coaster' ? `Speed <b>${Math.round(coaster.st.v * 3.6)} km/h</b>` : r.cycle ? `Phase ends in <b>${Math.max(0, Math.ceil(r.cycle[r.cycIdx][1] - r.phaseT))} s</b>` : '';
  $('trInfo').innerHTML = `<span>Riders aboard <b>${r.onboard.length * park.groupSize}</b></span><span>Cycles today <b>${r.cycles}</b></span>${extra ? `<span>${extra}</span>` : ''}`;
}

/* ---- tabbed table ---- */
const G2n = () => park.groupSize;
const TABS = {
  rides: { cols: [['name', 'Ride'], ['status', 'Status'], ['rph', 'Riders/h'], ['cap', 'Capacity/h', 1], ['wait', 'Wait min'], ['queue', 'Queue'], ['today', 'Today', 1]],
    rows: () => rides.map(r => ({ id: r.id, name: r.name, status: r.status, rph: r.rph, cap: r.hourlyCap, wait: r.queue && r.status === 'Open' ? Math.ceil(waitOf(r)) : null, queue: r.queue ? r.queue.list.length * G2n() * QK : null, today: Math.round(r.ridesToday) })) },
  queues: { cols: [['name', 'Queue'], ['serves', 'Serves', 1], ['len', 'Length'], ['cap', 'Capacity', 1], ['wait', 'Wait min']],
    rows: () => Object.values(ents).filter(e => e.kind === 'queue').map(e => ({ id: e.id, name: e.name, serves: e.owner.name, len: e.queue.list.length * G2n() * QK, cap: e.queue.cap * G2n() * QK, status: e.owner.kind === 'ride' ? e.owner.status : 'Open', wait: e.owner.kind === 'ride' ? (e.owner.status !== 'Open' ? null : Math.ceil(waitOf(e.owner))) : Math.ceil(e.queue.list.length * e.owner.svc / 60 * 5) })) },
  stalls: { cols: [['name', 'Stall'], ['status', 'Status'], ['ord', 'Orders/h'], ['queue', 'Queue'], ['rev', 'Revenue'], ['ordT', 'Orders today', 1]],
    rows: () => stalls.map(s => ({ id: s.id, name: s.name, status: park.open ? 'Open' : 'Closed', ord: s.ordersHr, queue: s.queue.list.length * G2n() * QK, rev: s.revenue, ordT: s.orders })) },
};
const tbHead = document.querySelector('#table thead'), tbBody = document.querySelector('#table tbody'), rowEls = { rides: {}, queues: {}, stalls: {} };
function paintHead() {
  const S = sortS[tab] || {}; tbHead.innerHTML = '<tr>' + TABS[tab].cols.map(c => `<th data-k="${c[0]}" class="${S.key === c[0] ? 's' : ''}${c[2] ? ' lo' : ''}">${c[1]}<span class="ar">${S.key === c[0] ? (S.dir > 0 ? '▲' : '▼') : ''}</span></th>`).join('') + '</tr>';
  tbBody.innerHTML = ''; for (const id in rowEls[tab]) tbBody.appendChild(rowEls[tab][id]);
}
function cellText(k, v, r) {
  if (v === null || v === undefined) return k === 'wait' && r.status && r.status !== 'Open' ? r.status : '–'; if (k === 'status') return `<span class="st ${v}">${v}</span>`; if (k === 'rev') return '$' + fmtN(v);
  return typeof v === 'number' ? fmtN(v) : esc(v);
}
function paintTable() {
  const T = TABS[tab], rows = T.rows(), S = sortS[tab];
  if (S) rows.sort((a, b) => { const x = a[S.key], y = b[S.key]; return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * S.dir; });
  let prev = null;
  rows.forEach(r => {
    let tr = rowEls[tab][r.id];
    if (!tr) { tr = rowEls[tab][r.id] = document.createElement('tr'); tr.dataset.id = r.id; tr.innerHTML = T.cols.map(c => `<td${c[2] ? ' class="lo"' : ''}></td>`).join(''); }
    T.cols.forEach((c, i) => { const td = tr.children[i], h = cellText(c[0], r[c[0]], r); if (td.dataset.h !== h) { td.innerHTML = h; td.dataset.h = h; } td.classList.toggle('hi', c[0] === 'wait' && r.wait !== null && r.wait >= WAIT_HI); });
    tr.classList.toggle('sel', !!sel && sel.id === r.id);
    if (tr.parentNode !== tbBody || (prev ? prev.nextSibling : tbBody.firstChild) !== tr) tbBody.insertBefore(tr, prev ? prev.nextSibling : tbBody.firstChild);
    prev = tr;
  });
}
tbHead.addEventListener('click', e => { const th = e.target.closest('th'); if (!th) return; const S = sortS[tab]; sortS[tab] = { key: th.dataset.k, dir: S && S.key === th.dataset.k ? -S.dir : (th.dataset.k === 'name' || th.dataset.k === 'serves' ? 1 : -1) }; paintHead(); paintTable(); });
tbBody.addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) park.select(tr.dataset.id); });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); paintHead(); paintTable(); $('table').classList.remove('col'); }));
$('tbCol').addEventListener('click', () => $('table').classList.toggle('col'));
document.querySelectorAll('#dock button').forEach(b => b.addEventListener('click', () => setSheet(root.dataset.sheet === b.dataset.sheet ? 'none' : b.dataset.sheet)));

/* ---- alerts: generated from the simulation ---- */
const alerts = [], acond = {};
function addAlert(key, text, ent, icon, live) { alerts.unshift({ key, text, ent, icon, live, time: park.clock, seen: false }); if (alerts.length > 24) alerts.pop(); paintAlerts(); }
function resolveAlert(key) { for (const a of alerts) if (a.key === key && a.live) { a.live = false; a.done = park.clock; } paintAlerts(); }
function markSeen() { alerts.forEach(a => { a.seen = true; }); paintAlerts(); }
function paintAlerts() {
  const n = alerts.filter(a => !a.seen).length, live = alerts.filter(a => a.live).length; $('badge').textContent = n > 9 ? '9+' : n; $('badge').style.display = n ? '' : 'none'; $('alSub').textContent = live ? live + ' active' : 'all clear';
  $('alist').innerHTML = alerts.length ? alerts.map((a, i) => `<button class="al${a.live ? ' live' : ''}" data-i="${i}"><b class="ai">${svgI(a.icon)}</b><div>${esc(a.text)}<span>${a.live ? 'Active since ' + a.time : a.done ? a.time + ', cleared ' + a.done : a.time}</span></div></button>`).join('') : '<div class="empty">All quiet. Alerts from the park appear here.</div>';
}
$('alist').addEventListener('click', e => { const b = e.target.closest('.al'); if (!b) return; const a = alerts[+b.dataset.i]; if (a && a.ent) park.select(a.ent); afterPick(); });
park.on('weather', (k, was) => {
  paintWeather(); paintTod(); const w = WX[k];
  for (const r of rides) {
    const ck = 'closed:' + r.id, hk = 'hold:' + r.id;
    if (r.wClosed) addAlert(ck, `${r.name} closed for rain`, r.id, 'ban', true); else if (acond[ck]) { resolveAlert(ck); addAlert('open:' + r.id, `${r.name} reopened`, r.id, 'check', false); }
    if (r.wHold) addAlert(hk, `${r.name} on wind hold`, r.id, 'pause', true); else if (acond[hk]) { resolveAlert(hk); addAlert('open:' + r.id, `${r.name} released from wind hold`, r.id, 'check', false); }
    acond[ck] = r.wClosed; acond[hk] = r.wHold;
  }
  if (k !== was) addAlert('wx', 'Weather: ' + w.name, null, WXI[k], false); toast('Weather: ' + w.name);
});
park.on('parade', st => {
  if (st === 'Assembling') addAlert('parade', `Parade assembling, starts ${fmtT(SHOWS.find(s => s > park.time - 0.001) ?? SHOWS[0])}`, 'parade', 'flag', true);
  else if (st === 'On route') { resolveAlert('parade'); addAlert('parade', 'Parade is on route', 'parade', 'flag', true); }
  else { resolveAlert('parade'); addAlert('parade-end', 'Parade finished, crossings reopen', 'parade', 'check', false); }
});
function checkAlerts() {
  for (const r of rides) if (r.queue) {
    const w = waitOf(r), k = 'wait:' + r.id;
    if (!acond[k] && r.status === 'Open' && w >= WAIT_HI) { acond[k] = true; addAlert(k, `${r.name}: ${Math.round(w)} min wait`, r.id, 'clock', true); }
    else if (acond[k] && (w < WAIT_LO || r.status !== 'Open')) { acond[k] = false; resolveAlert(k); }
  }
}

/* ---- selection + frame hooks ---- */
park.on('select', id => {
  const e = id && ents[id]; if (e) { const r = e.kind === 'ride' ? e : e.kind === 'queue' && e.owner.kind === 'ride' ? e.owner : null; if (r) { trId = r.id; $('trSel').value = r.id; } }
  if (root.classList.contains('m')) setSheet(e ? 'detail' : root.dataset.sheet === 'detail' ? 'none' : root.dataset.sheet);
  renderDetail(); paintTracker(); paintTable();
});
function clockText() { $('clock').textContent = park.clock; const o = $('open'); o.textContent = park.open ? 'Open' : 'Closed'; o.classList.toggle('on', park.open); }
function uiUpdate(dt) {
  document.body.classList.toggle('night', env.day < 0.5);
  trT -= dt; if (trT <= 0) { trT = 0.1; paintTracker(); }
  smpT -= dt; if (smpT <= 0) { smpT = 2; sample(); paintSparks(); }
  uiT -= dt; if (uiT <= 0) { uiT = 0.5; clockText(); paintKpis(); renderDetail(); paintTable(); checkAlerts(); }
}
root.dataset.sheet = 'none'; paintHead(); paintWeather(); paintTod(); paintAlerts(); $('trSel').value = trId;
park.ui = { alerts, hist: HIST, totals: parkTotals, setSheet, toast, cycleState };

/* ============ 8. MAIN LOOP ============ */

Object.assign(park.debug, { fountain: FOUNTAIN, queuePosts, scene, cam, info: renderer.info, project(x, y, z) { const v = V3(x, y, z).project(camera); return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight, z: v.z }; } });
function newDay() {
  park.time = park.openH; park.day++; park.showsToday = 0; park.departed = 0; park.entries = 0; park.merch = 0;
  waitK = undefined; for (const r of rides) { r.wS = undefined; r.ridesToday = 0; r.cycles = 0; r.onboard.length = 0; if (r.queue) r.queue.list.length = 0; }
  for (const s of stalls) { s.revenue = 0; s.orders = 0; s.served = 0; s.serveT.length = 0; s.cur = null; s.queue.list.length = 0; }
  for (const e of Object.values(ents)) if (e.queue) e.queue.head = 0;
  for (const g of guests) { release(g); g.state = 'off'; }
  park.emit('newday', park.day);
}
function simStep(dt) {
  park.now += dt; park.time += dt * park.timeScale / 60; if (park.time >= park.closeH) newDay();
  for (const w of walkers) w.step = 0;
  updateParade(dt); updateRidesStalls(dt); updateGuests(dt);
  for (const a of anims) a(dt, park.now);
}
park.debug.walkers = walkers; park.debug.G = G;
Object.defineProperty(park.debug, 'paradeHead', { get: () => paradeHead });
park.debug.advance = (sec, step = 0.05) => { for (let t = 0; t < sec; t += step) simStep(step); };
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  simStep(dt); renderGuests(dt); updateEnv(dt); updateCamera(dt); updateSelection(dt); uiUpdate(dt);
  park.emit('tick', dt);
  renderer.render(scene, camera);
}
for (const r of rides) r.ridesToday = Math.round(r.hourlyCap * 0.7 * (park.time - park.openH));
for (const s of stalls) { s.orders = Math.round(330 * (park.time - park.openH)); s.revenue = s.orders * s.price; }
for (let i = 0; i < 110; i++) spawnGuest(guests[i], true);
park.entries = 110; park.merch = park.entries * park.groupSize * KG * 4; park.guestCount = guests.filter(g => g.state !== 'off').length;
prefillHist(); clockText(); paintKpis(); paintSparks(); renderDetail(); paintTracker(); paintTable();
frame(); renderer.setAnimationLoop(frame);

</script>
